<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Loan Approval Prediction</h1>
    <p class="subtitle">Machine Learning Based Loan Eligibility Predictor</p>

    <form method="POST">
        <div class="grid">
            <div>
                <label>No. of Dependents</label>
                <input type="number" name="no_of_dependents" min="0" required>
            </div>

            <div>
                <label>Education</label>
                <select name="education" required>
                    <option value="Graduate">Graduate</option>
                    <option value="Not Graduate">Not Graduate</option>
                </select>
            </div>

            <div>
                <label>Self Employed</label>
                <select name="self_employed" required>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div>
                <label>Annual Income</label>
                <input type="number" name="income_annum" min="0" required>
            </div>

            <div>
                <label>Loan Amount</label>
                <input type="number" name="loan_amount" min="0" required>
            </div>

            <div>
                <label>Loan Term (years)</label>
                <input type="number" name="loan_term" min="1" required>
            </div>

            <div>
                <label>CIBIL Score</label>
                <input type="number" name="cibil_score" min="300" max="900" required>
            </div>

            <div>
                <label>Residential Assets Value</label>
                <input type="number" name="residential_assets_value" min="0" required>
            </div>

            <div>
                <label>Commercial Assets Value</label>
                <input type="number" name="commercial_assets_value" min="0" required>
            </div>

            <div>
                <label>Luxury Assets Value</label>
                <input type="number" name="luxury_assets_value" min="0" required>
            </div>

            <div>
                <label>Bank Asset Value</label>
                <input type="number" name="bank_asset_value" min="0" required>
            </div>
        </div>

        <button type="submit">Predict Loan Status</button>
    </form>

    {% if prediction %}
        <div class="result">
            <h2>Loan {{ prediction }}</h2>
            {% if probability is not none %}
                <p>Predicted approval probability: <strong>{{ probability }}%</strong></p>
            {% endif %}
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}
</div>
</body>
</html>
